name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Package.swift
            Sources
            App
            scripts
          sparse-checkout-cone-mode: false
      - name: Toolchain
        run: swift --version
      - name: Build app
        run: ./scripts/build-app.sh --universal
      - name: Verify bundle
        run: |
          test -x build/Displate.app/Contents/MacOS/Displate
          test -f build/Displate.app/Contents/Resources/AppIcon.icns
          lipo -archs build/Displate.app/Contents/MacOS/Displate
          codesign --verify --verbose build/Displate.app
      - name: Launch smoke test
        run: |
          open build/Displate.app
          sleep 8
          pgrep -x Displate || { echo "Displate exited during launch"; log show --last 2m --predicate 'process == "Displate"' | tail -50; exit 1; }
          pkill -x Displate
      - name: Render UI preview
        timeout-minutes: 3
        run: build/Displate.app/Contents/MacOS/Displate --render-preview build/preview
      - uses: actions/upload-artifact@v4
        with:
          name: ui-preview
          path: build/preview/*.png
      - name: Package
        run: cd build && ditto -c -k --keepParent Displate.app Displate.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Displate
          path: build/Displate.zip

  unload:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Unload
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Unload
      - name: Build app
        run: ./scripts/build-app.sh --universal
      - name: Verify bundle
        run: |
          test -x build/Unload.app/Contents/MacOS/Unload
          test -f build/Unload.app/Contents/Resources/AppIcon.icns
          lipo -archs build/Unload.app/Contents/MacOS/Unload
          codesign --verify --verbose build/Unload.app
      - name: Launch smoke test
        run: |
          open build/Unload.app
          sleep 8
          pgrep -x Unload || { echo "Unload exited during launch"; log show --last 2m --predicate 'process == "Unload"' | tail -50; exit 1; }
          pkill -x Unload
      - name: Render UI preview
        timeout-minutes: 3
        run: build/Unload.app/Contents/MacOS/Unload --render-preview build/preview
      - uses: actions/upload-artifact@v4
        with:
          name: unload-ui-preview
          path: Unload/build/preview/*.png
      - name: Package
        run: cd build && ditto -c -k --keepParent Unload.app Unload.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Unload
          path: Unload/build/Unload.zip

  breeze:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Breeze
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Breeze
      - name: Build app
        run: ./scripts/build-app.sh --universal
      - name: Verify bundle
        run: |
          test -x build/Breeze.app/Contents/MacOS/Breeze
          test -x build/Breeze.app/Contents/MacOS/BreezeHelper
          test -f build/Breeze.app/Contents/Resources/AppIcon.icns
          lipo -archs build/Breeze.app/Contents/MacOS/Breeze
          lipo -archs build/Breeze.app/Contents/MacOS/BreezeHelper
          codesign --verify --verbose build/Breeze.app
          codesign --verify --verbose build/Breeze.app/Contents/MacOS/BreezeHelper
      - name: Launch smoke test
        run: |
          open build/Breeze.app
          sleep 8
          pgrep -x Breeze || { echo "Breeze exited during launch"; log show --last 2m --predicate 'process == "Breeze"' | tail -50; exit 1; }
          pkill -x Breeze
      - name: Render UI preview
        timeout-minutes: 3
        run: build/Breeze.app/Contents/MacOS/Breeze --render-preview build/preview
      - uses: actions/upload-artifact@v4
        with:
          name: breeze-ui-preview
          path: Breeze/build/preview/*.png
      - name: Package
        run: cd build && ditto -c -k --keepParent Breeze.app Breeze.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Breeze
          path: Breeze/build/Breeze.zip

  # Publishes the three apps to a stable release so they can be downloaded without a GitHub account:
  # https://github.com/<owner>/<repo>/releases/download/apps/<App>.zip
  release:
    needs: [build, unload, breeze]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ls -R dist
          notes="Displate (displays), Unload (memory) and Breeze (fans) — menu bar apps for macOS 14+. Built from ${GITHUB_SHA::7}."
          if ! gh release view apps -R "$REPO" >/dev/null 2>&1; then
            gh release create apps -R "$REPO" --target "$GITHUB_SHA" --title "Displate, Unload & Breeze" --notes "$notes" --latest
          else
            gh release edit apps -R "$REPO" --notes "$notes"
          fi
          gh release upload apps -R "$REPO" --clobber \
            dist/Displate/Displate.zip dist/Unload/Unload.zip dist/Breeze/Breeze.zip
